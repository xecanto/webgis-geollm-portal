<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <g transform="translate(500,500)">
    <!-- Main grid lines -->
    <g opacity="0.3">
      <!-- Horizontal grid lines -->
      <line x1="-450" y1="-400" x2="450" y2="-400" stroke="#1A936F" stroke-width="1" />
      <line x1="-450" y1="-300" x2="450" y2="-300" stroke="#1A936F" stroke-width="1" />
      <line x1="-450" y1="-200" x2="450" y2="-200" stroke="#1A936F" stroke-width="1" />
      <line x1="-450" y1="-100" x2="450" y2="-100" stroke="#1A936F" stroke-width="1" />
      <line x1="-450" y1="0" x2="450" y2="0" stroke="#1A936F" stroke-width="1" />
      <line x1="-450" y1="100" x2="450" y2="100" stroke="#1A936F" stroke-width="1" />
      <line x1="-450" y1="200" x2="450" y2="200" stroke="#1A936F" stroke-width="1" />
      <line x1="-450" y1="300" x2="450" y2="300" stroke="#1A936F" stroke-width="1" />
      <line x1="-450" y1="400" x2="450" y2="400" stroke="#1A936F" stroke-width="1" />
      
      <!-- Vertical grid lines -->
      <line x1="-400" y1="-450" x2="-400" y2="450" stroke="#1A936F" stroke-width="1" />
      <line x1="-300" y1="-450" x2="-300" y2="450" stroke="#1A936F" stroke-width="1" />
      <line x1="-200" y1="-450" x2="-200" y2="450" stroke="#1A936F" stroke-width="1" />
      <line x1="-100" y1="-450" x2="-100" y2="450" stroke="#1A936F" stroke-width="1" />
      <line x1="0" y1="-450" x2="0" y2="450" stroke="#1A936F" stroke-width="1" />
      <line x1="100" y1="-450" x2="100" y2="450" stroke="#1A936F" stroke-width="1" />
      <line x1="200" y1="-450" x2="200" y2="450" stroke="#1A936F" stroke-width="1" />
      <line x1="300" y1="-450" x2="300" y2="450" stroke="#1A936F" stroke-width="1" />
      <line x1="400" y1="-450" x2="400" y2="450" stroke="#1A936F" stroke-width="1" />
    </g>
    
    <!-- Minor grid lines -->
    <g opacity="0.15">
      <!-- Horizontal minor grid lines -->
      <line x1="-450" y1="-350" x2="450" y2="-350" stroke="#1A936F" stroke-width="0.5" />
      <line x1="-450" y1="-250" x2="450" y2="-250" stroke="#1A936F" stroke-width="0.5" />
      <line x1="-450" y1="-150" x2="450" y2="-150" stroke="#1A936F" stroke-width="0.5" />
      <line x1="-450" y1="-50" x2="450" y2="-50" stroke="#1A936F" stroke-width="0.5" />
      <line x1="-450" y1="50" x2="450" y2="50" stroke="#1A936F" stroke-width="0.5" />
      <line x1="-450" y1="150" x2="450" y2="150" stroke="#1A936F" stroke-width="0.5" />
      <line x1="-450" y1="250" x2="450" y2="250" stroke="#1A936F" stroke-width="0.5" />
      <line x1="-450" y1="350" x2="450" y2="350" stroke="#1A936F" stroke-width="0.5" />
      
      <!-- Vertical minor grid lines -->
      <line x1="-350" y1="-450" x2="-350" y2="450" stroke="#1A936F" stroke-width="0.5" />
      <line x1="-250" y1="-450" x2="-250" y2="450" stroke="#1A936F" stroke-width="0.5" />
      <line x1="-150" y1="-450" x2="-150" y2="450" stroke="#1A936F" stroke-width="0.5" />
      <line x1="-50" y1="-450" x2="-50" y2="450" stroke="#1A936F" stroke-width="0.5" />
      <line x1="50" y1="-450" x2="50" y2="450" stroke="#1A936F" stroke-width="0.5" />
      <line x1="150" y1="-450" x2="150" y2="450" stroke="#1A936F" stroke-width="0.5" />
      <line x1="250" y1="-450" x2="250" y2="450" stroke="#1A936F" stroke-width="0.5" />
      <line x1="350" y1="-450" x2="350" y2="450" stroke="#1A936F" stroke-width="0.5" />
    </g>
  </g>
</svg>
